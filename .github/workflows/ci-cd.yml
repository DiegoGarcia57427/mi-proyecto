name: CI/CD - Python + EC2 Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2️⃣ Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4️⃣ Ejecutar tests (si existen)
      - name: Ejecutar tests
        run: |
          if [ -d "tests" ]; then pytest -v; else echo "Sin tests"; fi

  deploy:
    name: 🚀 Deploy en AWS EC2
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'

    steps:
      # 1️⃣ Clonar código
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2️⃣ Desplegar en EC2
      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}          # IP pública de tu EC2
          username: ec2-user                     # Usuario por defecto en Amazon Linux
          key: ${{ secrets.AWS_PEM_KEY }}       # Contenido completo de tu .pem como secreto
          port: 22
          script: |
            cd /home/ec2-user/mi-proyecto        # Carpeta de tu proyecto en EC2
            git pull origin main                  # Asegura que la última versión esté
            echo "Despliegue completado correctamente ✅"
