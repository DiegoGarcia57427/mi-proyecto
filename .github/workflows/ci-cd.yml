name: CI/CD - Python + EC2 Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el código
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2️⃣ Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ Cache de dependencias (acelera builds)
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4️⃣ Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5️⃣ Ejecutar tests (si existen)
      - name: Ejecutar tests
        run: |
          if [ -d "tests" ]; then pytest -v; else echo "Sin tests"; fi

  deploy:
    name: 🚀 Deploy en AWS EC2
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'

    steps:
      # 1️⃣ Clonar código
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2️⃣ Conectarse al servidor EC2 y desplegar
      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ec2-user
          key: ${{ secrets.AWS_PEM_KEY }}
          script: |
            cd /home/ec2
			

